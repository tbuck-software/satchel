name: Desktop releases

on:
  schedule:
    - cron: '14 3 * * *'
    - cron: '14 6 * * 1'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel built from main
        type: choice
        options: [nightly, stable]
        default: nightly
      force:
        description: Build even when main has not changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  prepare:
    if: github.repository == 'tbuck-software/satchel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare release version and source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ github.event.schedule == '14 6 * * 1' && 'stable' || inputs.channel || 'nightly' }}
          RELEASE_FORCE: ${{ inputs.force }}
        run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.build == 'true'
        with:
          name: release-plan
          path: output/release-plan.json
          retention-days: 3

  secrets:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/secret-scan.yml

  verify:
    needs: [prepare, secrets]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev gnupg
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: ''
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm run plugins:build
      - name: Check the complete source before packaging
        env:
          SATCHEL_REQUIRE_PLUGIN_ARTIFACTS: '1'
        run: |
          make check
          pnpm audit --audit-level=moderate
          python3 scripts/check-rust-audit-exceptions.py
          for lockfile in Cargo.lock fuzz/Cargo.lock; do
            cargo audit --file "$lockfile"
          done
          cargo deny --locked check licenses sources
          cargo fmt --all --check
          cargo clippy -p satchel -p satchel-core --all-targets -- -D warnings

  build:
    needs: [prepare, verify]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            bundles: app,dmg
          - target: x86_64-apple-darwin
            runner: macos-15
            bundles: app,dmg
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            bundles: appimage
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: output
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Git Bash puts its reduced MSYS Perl ahead of the native installation.
          # Resolve Perl from PowerShell and pin openssl-src to that executable.
          $perl = (Get-Command perl.exe -ErrorAction Stop).Source
          & $perl -MIPC::Cmd -e 'die "Expected native Windows Perl\n" unless $^O eq "MSWin32"; print "$^X\n";'
          if ($LASTEXITCODE -ne 0) { throw 'Native Perl cannot configure OpenSSL' }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev patchelf
      - name: Enable Intel verification on Apple Silicon runners
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ] && ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
          build-warnings: ''
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Require updater signing key
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: test "$HAS_KEY" = true
      - name: Configure release and notices
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          node scripts/configure-release.mjs
          node scripts/third-party-notices.mjs
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("output/release-plan.json", "utf8")); fs.appendFileSync(process.env.GITHUB_ENV, `SATCHEL_RELEASE_CHANNEL=${p.channel}\n`);'
      - name: Import Apple distribution certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          HAS_NOTARIZATION: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && ((secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '') || (secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '')) }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ "$REPOSITORY_PRIVATE" != true ]; then
              echo '::error::Public macOS releases require Developer ID signing and notarization.'
              exit 1
            fi
            echo 'Private build: using ad-hoc macOS signing and the independent updater signature.'
            exit 0
          fi
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test "$HAS_NOTARIZATION" = true
          umask 077
          cert="$RUNNER_TEMP/satchel-distribution.p12"
          keychain="$RUNNER_TEMP/satchel-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Prepare App Store Connect notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then exit 0; fi
          [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          test -n "$APPLE_API_ISSUER"
          umask 077
          mkdir -p "$RUNNER_TEMP/satchel-notarization"
          key_path="$RUNNER_TEMP/satchel-notarization/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          printf 'APPLE_API_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
      - run: pnpm run plugins:build
      - name: Sign bundled plugin packages
        shell: bash
        env:
          SATCHEL_PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.SATCHEL_PLUGIN_SIGNING_PRIVATE_KEY }}
        run: node scripts/package-release-plugins.mjs
      - name: Configure Google desktop OAuth
        env:
          SATCHEL_GMAIL_DESKTOP_CLIENT_CONFIG: ${{ secrets.SATCHEL_GMAIL_DESKTOP_CLIENT_CONFIG }}
        run: node scripts/configure-release-oauth.mjs
      - name: Build signed desktop artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SATCHEL_OUTLOOK_CLIENT_ID: ${{ vars.SATCHEL_OUTLOOK_CLIENT_ID }}
          SATCHEL_OUTLOOK_REDIRECT_URI: ${{ vars.SATCHEL_OUTLOOK_REDIRECT_URI }}
        run: |
          for variable in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!variable}" ]; then unset "$variable"; fi
          done
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          build_args=(--ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config output/release-config.json)
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            bash scripts/build-notarized-macos.sh "target/${{ matrix.target }}/release/bundle/macos" "${build_args[@]}"
          else
            pnpm exec tauri build "${build_args[@]}"
          fi
      - name: Verify plugin signatures with the release host
        shell: bash
        run: |
          host="target/${{ matrix.target }}/release/satchel"
          if [ "$RUNNER_OS" = Windows ]; then host="$host.exe"; fi
          "$host" --verify-oauth-config
          "$host" --verify-plugin-packages output/bundled-plugins
      - name: Verify macOS code signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          shopt -s nullglob
          apps=(target/${{ matrix.target }}/release/bundle/macos/*.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          "${apps[0]}/Contents/MacOS/satchel" --verify-plugin-packages "${apps[0]}/Contents/Resources/plugins"
          codesign --display --entitlements :- "${apps[0]}" > "$RUNNER_TEMP/satchel-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-unsigned-executable-memory' "$RUNNER_TEMP/satchel-entitlements.plist")" = true
          if [ "$HAS_APPLE_CERTIFICATE" = true ]; then
            bash scripts/verify-notarization-ticket.sh "${apps[0]}"
            # Check the shipped copies too: packaging must retain the app ticket.
            archives=(target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
            images=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            test "${#archives[@]}" -eq 1
            test "${#images[@]}" -eq 1
            verify_dir="$(mktemp -d "$RUNNER_TEMP/satchel-packaged-apps.XXXXXX")"
            mkdir "$verify_dir/update" "$verify_dir/dmg"
            app_name="${apps[0]##*/}"
            tar -xzf "${archives[0]}" -C "$verify_dir/update"
            codesign --verify --deep --strict "$verify_dir/update/$app_name"
            bash scripts/verify-notarization-ticket.sh "$verify_dir/update/$app_name"
            "$verify_dir/update/$app_name/Contents/MacOS/satchel" --verify-plugin-packages "$verify_dir/update/$app_name/Contents/Resources/plugins"
            trap 'hdiutil detach "$verify_dir/dmg" -quiet >/dev/null 2>&1 || true' EXIT
            hdiutil attach "${images[0]}" -mountpoint "$verify_dir/dmg" -nobrowse -readonly -quiet
            codesign --verify --deep --strict "$verify_dir/dmg/$app_name"
            bash scripts/verify-notarization-ticket.sh "$verify_dir/dmg/$app_name"
            "$verify_dir/dmg/$app_name/Contents/MacOS/satchel" --verify-plugin-packages "$verify_dir/dmg/$app_name/Contents/Resources/plugins"
          fi
      - run: node scripts/collect-release.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: output/release-artifacts/${{ matrix.target }}/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [prepare, verify, build]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: output
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: output/release-assets
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-release-installer.mjs
      - name: Publish only the complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
