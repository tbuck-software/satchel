version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    groups:
      rust-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    groups:
      javascript-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    schedule:
      interval: weekly
