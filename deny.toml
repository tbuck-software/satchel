# Audit vulnerabilities separately with cargo-audit and its dated exception.
[licenses]
confidence-threshold = 0.95
include-dev = true
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "bzip2-1.0.6",
]


# Native clipboard support on Windows; reviewed against the Boost 1.0 text.
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.3"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tbuck-software/postroom.git"]
